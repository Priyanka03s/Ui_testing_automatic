name: DesignCheck AI CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Backend Dependencies
        working-directory: ./Backend
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Run Backend Unit & Integration Tests
        working-directory: ./Backend
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_ci_key
          FIGMA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          MONGODB_URI: mongodb://localhost:27017/ci_test
        run: npm run test

      - name: Build Frontend Application
        working-directory: ./Frontend
        run: npm run build
